# Оборудование, которое бригада берёт в офисе на весь рабочий день.
#
# Ответ экспертов (п.4): «Бригада получает оборудование в офисе сразу на весь
# рабочий день. При перепланировании на бригаду могут назначаться только те
# заявки, для выполнения которых у неё имеется необходимое оборудование.
# Допустимый запас оборудования можно определить самостоятельно.»
#
# В выгрузке состава оборудования нет, поэтому потребность выводится из типа
# работ и уточняющего описания, а утренний запас задаётся здесь. Это ограничение
# на вместимость маршрута: сумма потребностей по маршруту не может превысить
# запас, выданный утром.

# Потребность заявки. Правила применяются сверху вниз, срабатывает первое.
# work_type — «Тип заявки BK», hd_match — подстрока в «Тип заявки HD» (* — любая).
needs:
  # Замена приставки — техник везёт приставку.
  - { work_type: "*", hd_match: "приставк", items: { stb: 1 } }
  # Замена роутера по заявке клиента.
  - { work_type: "*", hd_match: "роутер", items: { router: 1 } }
  # Новое подключение: роутер ставится практически всегда.
  - { work_type: "Подключение", hd_match: "*", items: { router: 1 } }
  # Дозаказ оборудования — это и есть довоз железа; состав в выгрузке не указан,
  # берём один роутер как типовой случай.
  - { work_type: "Дозаказ", hd_match: "*", items: { router: 1 } }
  # Остальное — ремонты, аварии, информационные выезды — оборудования не требуют.
  - { work_type: "*", hd_match: "*", items: {} }

# Утренний запас на бригаду. Подобран по спросу: на участке около сорока
# заявок с роутером на десяток инженеров, поэтому запаса в четыре штуки хватает
# на полный день работы, но он ограничивает «сгрузить все подключения на одного».
stock:
  router: 4
  stb: 2

# Человеческие названия для интерфейса и объяснений.
titles:
  router: роутер
  stb: ТВ-приставка
