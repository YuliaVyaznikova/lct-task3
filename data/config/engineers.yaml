# Параметры синтетического справочника инженеров.
#
# В выгрузке билайна инженеров нет: контрольный файл содержит только фамилии бригад,
# без навыков, транспорта и смен. ТЗ §6 прямо разрешает создать такие данные
# самостоятельно «по тем же правилам» и описать допущения — этим занимается
# planner/ingest/engineers.py. Генерация детерминирована по seed.
#
# count берётся равным числу бригад в контрольном распределении региона,
# чтобы масштаб совпадал с реальностью (12 / 12 / 11).

defaults:
  # Доли инженеров по числу навыков. Универсалов меньшинство — иначе ограничение
  # «Квалификация» перестаёт работать и решение выглядит неубедительно.
  skills_mix:
    three: 0.25
    two: 0.40
    one: 0.35

  # Вероятность навыка пропорциональна спросу региона (доле рабочих минут),
  # но не ниже floor — иначе редкие навыки некому выполнять.
  skill_demand_floor: 0.12

  # Преимущественно пешеходы и общественный транспорт (Q&A, блок 4).
  transport_mix:
    public: 0.35
    foot: 0.25
    car: 0.30
    bike: 0.10

  # Две смены: утренняя закрывает окна с 10:00, вечерняя — слот 20:00–22:00.
  # Вечерняя заканчивается в 23:00, чтобы 70-минутное подключение, начатое
  # в конце окна, успевало завершиться внутри смены.
  shifts:
    - { start: "09:00", end: "18:00", share: 0.5 }
    - { start: "14:00", end: "23:00", share: 0.5 }

  # Доля заявок «подключение», которым проставляется требуемый транспорт «автомобиль»
  # (легенда: инженер везёт оборудование). Без этого ограничение «Ресурс» непроверяемо.
  required_transport_share: 0.10

  # Минимум автомобилистов в регионе.
  min_cars: 2

regions:
  vostok:
    count: 12

  yugo-vostok:
    count: 12
    # В этом участке есть Домодедово, Кашира и Ступино — до них 25–91 км от офиса.
    # Пешком и на велосипеде туда не добраться, поэтому автомобилистов больше.
    transport_mix:
      public: 0.25
      foot: 0.15
      car: 0.50
      bike: 0.10
    min_cars: 5

    # Выездные базы. В контрольном распределении видно, что удалённые кластеры
    # обслуживают закреплённые бригады: Домодедово — одна, Каширу и Ступино —
    # две. Они не ездят туда из Бирюлёва каждое утро, а начинают день на месте.
    # ТЗ §2.4 предусматривает у инженера собственную стартовую точку, поэтому
    # моделируем это, а не заставляем всех выезжать из офиса участка.
    remote_bases:
      - districts: ["Домодедово"]
        engineers: 1
      - districts: ["Кашира", "Ступино"]
        engineers: 2

  yugocentr:
    count: 11
